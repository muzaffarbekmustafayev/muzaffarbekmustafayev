<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240" style="background: transparent; border-radius: 12px; overflow: hidden;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="wave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#a5f3fc" />
    </linearGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes waveAnim1 {
        0% { transform: translateX(0); }
        50% { transform: translateX(-30px); }
        100% { transform: translateX(0); }
      }
      @keyframes waveAnim2 {
        0% { transform: translateX(0); }
        50% { transform: translateX(30px); }
        100% { transform: translateX(0); }
      }
      .anim-wave1 {
        animation: waveAnim1 10s ease-in-out infinite;
      }
      .anim-wave2 {
        animation: waveAnim2 12s ease-in-out infinite;
      }
      .header-title {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 46px;
        font-weight: 700;
        letter-spacing: -0.5px;
        fill: url(#textGrad);
      }
      .header-sub {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 500;
        letter-spacing: 0.5px;
        fill: #38bdf8;
      }
      .badge-text {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        letter-spacing: 2px;
        fill: #06b6d4;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="240" fill="url(#bgGrad)" />

  <!-- Background Grid Pattern -->
  <rect width="1200" height="240" fill="url(#grid)" />

  <!-- Ambient Glowing Orbs -->
  <circle cx="200" cy="40" r="140" fill="#06b6d4" opacity="0.12" filter="url(#glow)" />
  <circle cx="1000" cy="180" r="160" fill="#0284c7" opacity="0.15" filter="url(#glow)" />

  <!-- Flowing Waves at the bottom -->
  <g class="anim-wave1">
    <path d="M 0 160 Q 300 110, 600 170 T 1200 150 L 1200 240 L 0 240 Z" fill="url(#wave1)" />
  </g>
  <g class="anim-wave2">
    <path d="M 0 180 Q 350 220, 700 170 T 1200 190 L 1200 240 L 0 240 Z" fill="url(#wave2)" />
  </g>

  <!-- Cyber Accents -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="8,8" />
  
  <!-- System Status Badge -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-14" width="280" height="26" rx="13" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="-115" cy="-1" r="4" fill="#10b981" />
    <text x="-95" y="4" class="badge-text">SYS:ONLINE // ARCHITECT</text>
  </g>

  <!-- Centered Hero Typography -->
  <text x="600" y="118" text-anchor="middle" class="header-title">Muzaffarbek Mustafayev</text>
  <text x="600" y="156" text-anchor="middle" class="header-sub">Senior Software Engineer | AI &amp; Financial Systems Architect</text>
</svg>